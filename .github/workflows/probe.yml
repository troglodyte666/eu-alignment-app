name: Temporary EEAS probe

on:
  push:
    branches: ["claude/github-scraper-app-setup-gvbjy4"]
    paths: ["probe_eeas.py", ".github/workflows/probe.yml"]

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        attempt: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q pandas openpyxl
      - run: python probe_eeas.py
