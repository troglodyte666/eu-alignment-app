name: Temporary fix verification

on:
  push:
    branches: ["claude/github-scraper-app-setup-gvbjy4"]
    paths: [".github/workflows/probe.yml"]

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q requests pandas openpyxl
      - name: Run UN80 scraper
        run: python eu_alignment_scraper.py --refresh-urls
      - name: Commit (dry-run push) and summarise
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scraped_results.csv scraped_results_ga79.csv
          git diff --cached --quiet || git commit -q -m "Auto-update: $(date '+%d %b %Y')"
          echo "== dry-run push with the built-in token"
          git push --dry-run
          echo "== summary"
          python - <<'EOF'
          import csv, io, subprocess
          old = subprocess.run(["git", "show", "HEAD~1:scraped_results.csv"], capture_output=True, text=True).stdout
          old_urls = {r["URL"] for r in csv.DictReader(io.StringIO(old))}
          rows = list(csv.DictReader(open("scraped_results.csv", encoding="utf-8")))
          new = [r for r in rows if r["URL"] not in old_urls]
          countries = [c for c in rows[0] if c not in ("Date", "Title", "URL", "Has Alignment")]
          print(f"rows before={len(old_urls)} after={len(rows)} new={len(new)}")
          if new:
              dates = sorted(r["Date"] for r in new)
              aligned = [r for r in new if r["Has Alignment"] == "True"]
              print(f"new rows dated {dates[0]} .. {dates[-1]}; with alignment clause: {len(aligned)}")
              for r in sorted(new, key=lambda r: r["Date"]):
                  who = [c for c in countries if r[c] == "True"]
                  print(f"  {r['Date']} | {'A' if r['Has Alignment'] == 'True' else '-'} {len(who):2d} | {r['Title'][:95]}")
              for r in aligned[:3]:
                  print("  sample:", r["Title"][:70], "->", [c for c in countries if r[c] == "True"])
          EOF
